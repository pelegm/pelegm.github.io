<head>

<body class="problems-page" data-page="detail">
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
<nav class="site-nav" aria-label="Main navigation">
    <a href="../">Home</a>
    <a href="../projects/">Projects</a>

    <a class="is-current" aria-current="page" href="../problems/">Problems</a>
</nav>

<div id="body">
<div id="body2">
<div class="wrapper">
    <main id="main-content" class="problems-main problem-detail-main">
        <div id="problem-state" class="empty-state detail-state" role="status" aria-live="polite">
            <h2 id="state-heading">No problem selected</h2>
            <p id="state-message">Choose a published problem from the collection.</p>
        </div>

        <article id="problem-detail" class="problem-detail" hidden>
            <header class="problem-header">
                <p class="problem-heading-meta">
                    <span id="problem-code" class="problem-code"></span>
                    <span id="problem-status-badge" class="status-badge"></span>
                    <span id="problem-visibility-badge"
                        class="visibility-badge visibility-hidden" hidden>Hidden locally</span>
                </p>
                <h2 id="problem-title"></h2>
                <p id="problem-summary" class="problem-summary"></p>
            </header>

            <dl id="problem-metadata" class="problem-metadata"></dl>
            <div id="problem-content" class="problem-content"></div>
        </article>

        <noscript>
            <p class="noscript-note">JavaScript is required to display an individual problem.</p>
        </noscript>
    </main>
</div>
</div>
</div>
